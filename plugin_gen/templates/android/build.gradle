// The Android Gradle Plugin builds the native code with the Android NDK.

group = "{{.PackageName}}"
version = "1.0"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "{{.PackageName}}"
    }

    compileSdk = project.hasProperty('flutter') ? flutter.compileSdkVersion : 35
    ndkVersion = project.hasProperty('flutter') ? flutter.ndkVersion : android.ndkVersion

    defaultConfig {
        minSdk = project.hasProperty('flutter') ? flutter.minSdkVersion : 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    
    sourceSets {
        main.jniLibs.srcDirs = ['libs']
    }
    
    dependencies {
        implementation 'com.google.protobuf:protobuf-javalite:3.25.8'
    }
}
